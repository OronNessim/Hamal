<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HAMAL — בחר יחידה</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00d4aa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="חמ&quot;ל מלכ&quot;א">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--surface:#0e1420;--surface2:#151e30;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--accent:#00d4aa;--accent2:#00a884;--accent-glow:rgba(0,212,170,0.15);--gold:#f5a623;--text:#e8edf5;--muted:#4a6080;--muted2:#6b8aaa;--scan:rgba(0,212,170,0.025);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,var(--scan) 3px,var(--scan) 4px);pointer-events:none;z-index:9999;animation:scanMove 10s linear infinite;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,170,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,170,0.03) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0;}
@keyframes scanMove{0%{background-position:0 0}100%{background-position:0 200px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.wrap{position:relative;z-index:1;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:0;animation:fadeIn .6s ease;}

.logo-wrap{width:90px;height:90px;border-radius:18px;overflow:hidden;margin-bottom:1.2rem;filter:drop-shadow(0 0 20px rgba(0,212,170,0.3));animation:float 5s ease-in-out infinite;border:1px solid rgba(0,212,170,0.2);background:transparent;display:flex;align-items:center;justify-content:center;}
.logo-wrap img{width:100%;height:100%;object-fit:contain;}

.app-title{font-size:36px;font-weight:900;color:var(--text);letter-spacing:2px;margin-bottom:4px;}
.app-sub{font-size:11px;color:var(--muted);letter-spacing:3px;font-weight:500;margin-bottom:2.5rem;}

.search-wrap{width:100%;position:relative;margin-bottom:10px;}
.search-input{width:100%;padding:13px 40px 13px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:'Heebo',sans-serif;font-size:14px;direction:rtl;transition:all .2s;outline:none;}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.search-input::placeholder{color:var(--muted);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}

.dropdown{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:14px;overflow:hidden;max-height:320px;overflow-y:auto;}
.dropdown::-webkit-scrollbar{width:3px;}
.dropdown::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px;}

.unit-item{display:flex;align-items:center;gap:14px;padding:13px 16px;cursor:pointer;transition:all .15s;border-bottom:1px solid var(--border);}
.unit-item:last-child{border-bottom:none;}
.unit-item:hover{background:var(--surface2);}
.unit-item:hover .unit-arrow{color:var(--accent);}
.unit-logo{width:44px;height:44px;object-fit:contain;flex-shrink:0;border-radius:8px;}
.unit-logo.golani{background:#eb8e15;padding:4px;border-radius:8px;}
.unit-info{flex:1;}
.unit-name{font-size:15px;font-weight:700;color:var(--text);}
.unit-sub-text{font-size:11px;color:var(--muted2);margin-top:2px;}
.unit-badge{font-size:9px;padding:2px 7px;border-radius:8px;background:rgba(0,212,170,0.12);color:var(--accent);border:1px solid rgba(0,212,170,0.2);}
.unit-arrow{color:var(--muted);font-size:16px;transition:color .15s;}
.no-results{padding:2rem;text-align:center;font-size:13px;color:var(--muted);}

.sep{width:100%;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin:10px 0;}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--border2);}

.cell-panel{display:none;width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:14px;overflow:hidden;animation:fadeIn .25s ease;}
.cell-header{padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.cell-back{background:none;border:0.5px solid var(--border2);color:var(--muted2);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:'Heebo',sans-serif;}
.cell-back:hover{border-color:var(--accent);color:var(--accent);}
.cell-unit-name{font-size:13px;font-weight:700;}
.cell-unit-sub{font-size:10px;color:var(--muted2);}
.cell-item{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;transition:all .15s;border-bottom:1px solid var(--border);}
.cell-item:last-child{border-bottom:none;}
.cell-item:hover{background:var(--surface2);}
.cell-icon{width:40px;height:40px;border-radius:9px;background:rgba(0,212,170,0.1);border:1px solid rgba(0,212,170,0.2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.cell-name{font-size:14px;font-weight:700;}
.cell-desc{font-size:11px;color:var(--muted2);margin-top:2px;}
.cell-arr{color:var(--muted);font-size:14px;margin-right:auto;}
.cell-item:hover .cell-arr{color:var(--accent);}

.footer{margin-top:2rem;font-size:10px;color:var(--muted);letter-spacing:1px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-wrap">
    <img src="icon-192.png" alt="HAMAL"/>
  </div>
  <div class="app-title">HAMAL</div>
  <div class="app-sub">בחר יחידה</div>

  <div class="search-wrap">
    <input class="search-input" id="search" placeholder="חפש יחידה..." oninput="filterUnits()" autocomplete="off"/>
    <span class="search-icon">🔍</span>
  </div>

  <div class="dropdown" id="unit-list"></div>

  <div id="cell-section">
    <div class="sep" id="cell-sep" style="display:none;">בחר תא</div>
    <div class="cell-panel" id="cell-panel">
      <div class="cell-header">
        <button class="cell-back" onclick="backToUnits()">→</button>
        <div>
          <div class="cell-unit-name" id="cell-unit-name"></div>
          <div class="cell-unit-sub">בחר תא</div>
        </div>
      </div>
      <div id="cell-list"></div>
    </div>
  </div>

  <div class="footer">HAMAL v1.1.2 — מערכת ניהול חמ"ל</div>
</div>

    glowColor: 'rgba(110,170,90,0.75)',
    cells: [
      {id:'agam', name:'תא אג"ם', desc:'ניהול משמרות אג"ם', url:'app.html', icon:'📋'}
    ]
  }
];

var filtered = [...UNITS];

function renderUnits(){
  const el = document.getElementById('unit-list');
  if(!filtered.length){
    el.innerHTML='<div class="no-results">לא נמצאו יחידות</div>';
    return;
  }
  el.innerHTML = filtered.map(u => `
    <div class="unit-item" onclick="selectUnit('${u.id}')">
      <img class="unit-logo ${u.logoClass}" src="${u.logo}" alt="${u.name}"/>
      <div class="unit-info">
        <div class="unit-name">${u.name}</div>
        <div class="unit-sub-text">${u.sub}</div>
      </div>
      <span class="unit-badge">פעיל</span>
      <span class="unit-arrow">‹</span>
    </div>
  `).join('');
}

function filterUnits(){
  const q = document.getElementById('search').value.trim();
  filtered = q ? UNITS.filter(u => u.name.includes(q) || u.sub.includes(q)) : [...UNITS];
  renderUnits();
  hideCells();
}

function selectUnit(id){
  const unit = UNITS.find(u => u.id === id);
  if(!unit) return;
  document.getElementById('cell-unit-name').textContent = unit.name;
  const cl = document.getElementById('cell-list');
  cl.innerHTML = unit.cells.map(c => `
    <div class="cell-item" onclick="openCell('${c.url}','${id}','${c.id}')">
      <div class="cell-icon">${c.icon}</div>
      <div>
        <div class="cell-name">${c.name}</div>
        <div class="cell-desc">${c.desc}</div>
      </div>
      <span class="cell-arr">‹</span>
    </div>
  `).join('');
  document.getElementById('cell-sep').style.display = 'flex';
  document.getElementById('cell-panel').style.display = 'block';
  document.getElementById('unit-list').style.opacity = '0.4';
  document.getElementById('search').disabled = true;
}

function backToUnits(){
  hideCells();
}

function hideCells(){
  document.getElementById('cell-sep').style.display = 'none';
  document.getElementById('cell-panel').style.display = 'none';
  document.getElementById('unit-list').style.opacity = '1';
  document.getElementById('search').disabled = false;
}

function openCell(url, unitId, cellId){
  const unit = UNITS.find(u => u.id === unitId);
  const cell = unit ? unit.cells.find(c => c.id === cellId) : null;
  if(unit && cell){
    sessionStorage.setItem('hamal_unit', JSON.stringify({
      id: unit.id,
      name: unit.name,
      logo: unit.logo,
      logoClass: unit.logoClass,
      glowColor: unit.glowColor
    }));
    sessionStorage.setItem('hamal_cell', JSON.stringify({
      id: cell.id,
      name: cell.name,
      icon: cell.icon
    }));
  }
  window.location.href = url;
}

renderUnits();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/Hamal/sw.js').catch(()=>{});
}
</script>
